<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>VarCat · Spiral</title>
    <style id="spiral-styles">/* __SPIRAL_CSS__ */</style>
    <style>
      /* Plugin shell only — chrome comes from @aviala-design/spiral components + styles.css */
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: var(--sp-color-bg, #f9f8f8);
      }
      .vc-shell {
        padding: 14px;
      }
      .vc-mono {
        font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .vc-output {
        max-height: 300px;
        overflow: auto;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--sp-color-border-strong, #d6d5d4);
        background: var(--sp-color-surface, #fff);
      }
      .vc-output.error {
        color: var(--sp-color-danger, #ff1d4e);
      }
      .vc-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .vc-row > .grow {
        flex: 1;
        min-width: 0;
      }
      .vc-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .vc-meta {
        margin-left: auto;
        opacity: 0.65;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .vc-group {
        border: 1px solid var(--sp-color-border-strong, #d6d5d4);
        border-radius: 8px;
        overflow: hidden;
        background: var(--sp-color-surface, #fff);
      }
      .vc-group > summary {
        padding: 8px 10px;
        cursor: pointer;
        list-style: none;
        background: var(--sp-color-muted, #f0efef);
        font-weight: 600;
        font-size: 11px;
      }
      .vc-group > summary::-webkit-details-marker {
        display: none;
      }
      .vc-group-count {
        float: right;
        font-weight: 400;
        opacity: 0.7;
      }
      .vc-template-row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 10px;
        border-top: 1px solid var(--sp-color-border, #f0efef);
      }
      .vc-panel {
        padding: 10px 12px;
        border: 1px solid var(--sp-color-border-strong, #d6d5d4);
        border-radius: 8px;
        background: var(--sp-color-surface, #fff);
      }
      .vc-advanced > summary {
        cursor: pointer;
        padding: 8px 0;
        opacity: 0.75;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="ui.js"></script>
  </body>
</html>
