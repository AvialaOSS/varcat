<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>VarCat · Spiral</title>
    <style id="spiral-styles">/* __SPIRAL_CSS__ */</style>
    <style>
      /*
       * Plugin shell only. Chrome, type and colour come from
       * @aviala-design/spiral components + styles.css; what is left here is the
       * fixed-height iframe frame (header / scrolling body / action footer),
       * the monospace path type Spiral has no scale for, and a few flex
       * affordances Stack does not expose (wrap, grow, push-to-end).
       */
      /* Spiral's dist CSS ships no preflight; without this every padded
         full-width child overflows the narrow iframe by its own padding. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--color-background, #f9f8f8);
        overflow: hidden;
      }

      /* Surfaces default to the page tone; lift them so cards read as cards.
         The stock selected row is the theme secondary fill — too loud when a
         dozen rows are ticked at once. */
      .vc-shell {
        --list-bg: var(--box-box-normal-background-whiteonly, #ffffff);
        --card-bg: var(--box-box-normal-background-whiteonly, #ffffff);
        --list-item-selected-bg: var(--box-box-theme-lightbackground, #ffe9e3);
        display: flex;
        flex-direction: column;
        height: 100%;
        min-width: 0;
      }
      .vc-shell > .aviala-pagehead {
        flex: none;
        padding-inline: var(--padding-big, 14px);
      }

      /* Four steps must fit ~380px: drop the 120px per-step floor. */
      .vc-rail {
        flex: none;
        padding: var(--padding-default, 8px) var(--padding-big, 14px);
        background: var(--box-box-normal-background-whiteonly, #ffffff);
        border-bottom: 1px solid var(--border-border-normal-1, #f0efef);
      }
      .vc-rail .aviala-steps {
        --steps-item-min-width: 0;
        --steps-gap: var(--gap-component-space, 8px);
      }
      .vc-step {
        min-width: 0;
      }
      .vc-step[data-clickable='true'] {
        cursor: pointer;
      }

      .vc-body {
        flex: 1 1 auto;
        min-height: 0;
      }
      .vc-body-inner {
        padding: var(--padding-middle, 10px) var(--padding-big, 14px)
          var(--padding-big, 14px);
      }

      .vc-foot {
        flex: none;
        padding: var(--padding-middle, 10px) var(--padding-big, 14px);
        background: var(--box-box-normal-background-whiteonly, #ffffff);
        border-top: 1px solid var(--border-border-normal-1, #f0efef);
      }

      .vc-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--gap-component-space, 8px);
        min-width: 0;
      }
      .vc-row--tight {
        gap: var(--gap-inside, 4px);
      }
      /* Zero basis, not auto: Spiral's field shells are `width: 100%`, which in
         a wrapping row would claim the whole line and push siblings down. */
      .vc-grow {
        flex: 1 1 0;
        min-width: 0;
      }
      .vc-push {
        margin-inline-start: auto;
      }
      .vc-truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .vc-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--gap-component-space, 8px);
      }

      .vc-mono {
        font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;
        font-size: var(--typography-caption-size, 0.75rem);
        line-height: var(--typography-caption-line-height, 1rem);
      }
      .vc-log {
        margin: 0;
        padding: var(--padding-middle, 10px) var(--padding-big, 14px);
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--typography-caption-fg, #616060);
      }

      /* Dense path table — hundreds of rows, so rows stay cheap. */
      .vc-paths {
        padding: var(--padding-small, 6px) 0;
      }
      .vc-path {
        display: flex;
        gap: var(--gap-inside, 4px);
        padding: 1px var(--padding-big, 14px);
      }
      .vc-path__mark {
        width: 1ch;
        flex: none;
        color: var(--typography-caption-fg, #616060);
      }
      .vc-path__mark[data-status='new'] {
        color: var(--text-text-theme-primary-black, #bf2300);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="ui.js"></script>
  </body>
</html>
